databases:
  - name: fittrackr-db
    plan: free
    databaseName: fittrackr
    user: fittrackr_user

services:
  - type: web
    name: fittrackr
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput"
    postDeployCommand: "python manage.py reset_demo_data"
    startCommand: "python manage.py collectstatic --noinput && gunicorn FitTrackr.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ""
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: fittrackr-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "4"
    healthCheckPath: "/"
